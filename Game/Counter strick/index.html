<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter-Style Game (JS)</title>
    <style>
      canvas {
        background: #1e1e1e;
        display: block;
        margin: auto;
        border: 2px solid white;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family: sans-serif;
      }
      #shop {
        position: absolute;
        top: 50px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 20px;
        display: none;
        border: 2px solid white;
      }
      .button {
        display: block;
        margin: 10px 0;
        padding: 10px;
        background: #444;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="800" height="600"></canvas>
    <div id="shop">
      <h3>Weapon Shop & Upgrades</h3>
      <button class="button" onclick="buyWeapon('pistol')">Pistol (0)</button>
      <button class="button" onclick="buyWeapon('shotgun')">
        Shotgun (30)
      </button>
      <button class="button" onclick="buyWeapon('rifle')">Rifle (50)</button>
      <button class="button" onclick="upgrade('speed')">Speed +1 (20)</button>
      <button class="button" onclick="upgrade('health')">
        Max Health +50 (40)
      </button>
      <button class="button" onclick="upgrade('fireRate')">
        Fire Rate +1 (30)
      </button>
      <button class="button" onclick="toggleShop()">Close</button>
    </div>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const shop = document.getElementById("shop");

      const player = {
        x: 400,
        y: 300,
        speed: 5,
        health: 100,
        maxHealth: 100,
        fireRate: 20,
        fireCooldown: 0,
        targetX: null,
        targetY: null,
      };
      const bullets = [];
      const enemies = [];
      const particles = [];
      const powerUps = [];
      let score = 0;
      let wave = 1;
      let selectedWeapon = "pistol";
      const keys = {};
      let gameOver = false;
      let gameOverTimer = 0;
      let waveTimer = 0;

      const weaponStats = {
        pistol: { damage: 10, speed: 10 },
        shotgun: { damage: 25, speed: 7 },
        rifle: { damage: 5, speed: 20 },
      };

      const enemyTypes = {
        fast: { speed: 3, health: 10, size: 10, color: "purple" },
        tank: { speed: 0.8, health: 50, size: 20, color: "orange" },
        boss: { speed: 1, health: 200, size: 30, color: "darkred" },
      };

      function buyWeapon(type) {
        const prices = { pistol: 0, shotgun: 30, rifle: 50 };
        if (score >= prices[type]) {
          selectedWeapon = type;
          score -= prices[type];
          toggleShop();
        }
      }

      function upgrade(type) {
        const prices = { speed: 20, health: 40, fireRate: 30 };
        if (score >= prices[type]) {
          score -= prices[type];
          if (type === "speed") player.speed += 1;
          if (type === "health") {
            player.maxHealth += 50;
            player.health += 50;
          }
          if (type === "fireRate")
            player.fireRate = Math.max(5, player.fireRate - 1); // حداقل 5 فریم
          toggleShop();
        }
      }

      function toggleShop() {
        shop.style.display = shop.style.display === "none" ? "block" : "none";
      }

      function spawnEnemy() {
        if (wave % 5 === 0) {
          enemies.push({
            x: Math.random() * 800,
            y: Math.random() * 600,
            speed: enemyTypes.boss.speed,
            health: enemyTypes.boss.health,
            size: enemyTypes.boss.size,
            color: enemyTypes.boss.color,
            shootCooldown: 0,
            type: "boss",
          });
        } else {
          const enemiesToSpawn = wave * 2 + Math.floor(Math.random() * 3);
          for (let i = 0; i < enemiesToSpawn; i++) {
            const type = Math.random() > 0.5 ? "fast" : "tank";
            enemies.push({
              x: Math.random() * 800,
              y: Math.random() * 600,
              speed: enemyTypes[type].speed,
              health: enemyTypes[type].health,
              size: enemyTypes[type].size,
              color: enemyTypes[type].color,
              shootCooldown: 0,
              type,
            });
          }
        }
      }

      function spawnPowerUp() {
        if (Math.random() < 0.05) {
          // 5% شانس در هر فریم
          powerUps.push({
            x: Math.random() * 800,
            y: Math.random() * 600,
            type: Math.random() > 0.5 ? "health" : "fireRate",
            life: 600, // 10 ثانیه (60 فریم در ثانیه)
          });
        }
      }

      function spawnParticles(x, y, color) {
        for (let i = 0; i < 10; i++) {
          particles.push({
            x,
            y,
            dx: (Math.random() - 0.5) * 4,
            dy: (Math.random() - 0.5) * 4,
            radius: 2 + Math.random() * 2,
            color,
            life: 20,
          });
        }
      }

      function resetGame() {
        player.x = 400;
        player.y = 300;
        player.health = player.maxHealth;
        player.speed = 5;
        player.fireRate = 20;
        player.fireCooldown = 0;
        player.targetX = null;
        player.targetY = null;
        bullets.length = 0;
        enemies.length = 0;
        particles.length = 0;
        powerUps.length = 0;
        score = 0;
        wave = 1;
        selectedWeapon = "pistol";
        gameOver = false;
        gameOverTimer = 0;
        waveTimer = 0;
        spawnEnemy();
      }

      function drawHUD() {
        ctx.fillStyle = "gray";
        ctx.fillRect(20, 20, 200, 20);
        ctx.fillStyle = "green";
        ctx.fillRect(20, 20, 200 * (player.health / player.maxHealth), 20);

        ctx.fillStyle = "white";
        ctx.font = "16px Consolas";
        ctx.fillText("Score: " + score, 650, 30);
        ctx.fillText("Wave: " + wave, 650, 50);
        ctx.fillText("Weapon: " + selectedWeapon, 20, 55);
        if (waveTimer > 0) {
          ctx.fillText("Next Wave in: " + Math.ceil(waveTimer / 60), 650, 70);
        }
      }

      function drawMinimap() {
        ctx.fillStyle = "gray";
        ctx.fillRect(650, 500, 140, 90);
        ctx.fillStyle = "green";
        ctx.beginPath();
        ctx.arc(650 + player.x / 6, 500 + player.y / 6, 4, 0, Math.PI * 2);
        ctx.fill();
        for (const e of enemies) {
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(650 + e.x / 6, 500 + e.y / 6, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawGameOver() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "red";
        ctx.font = "48px Consolas";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "20px Consolas";
        ctx.fillText(
          "Score: " + score,
          canvas.width / 2,
          canvas.height / 2 + 20
        );
      }

      function drawPlayer() {
        ctx.fillStyle = "green";
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - 15);
        ctx.lineTo(player.x - 10, player.y + 10);
        ctx.lineTo(player.x + 10, player.y + 10);
        ctx.closePath();
        ctx.fill();
      }

      function drawEnemy(e) {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.rect(e.x - e.size, e.y - e.size, e.size * 2, e.size * 2);
        ctx.fill();
      }

      function drawPowerUp(p) {
        ctx.fillStyle = p.type === "health" ? "lime" : "cyan";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      document.addEventListener("keydown", (e) => {
        keys[e.key] = true;
        if (e.key === "e") toggleShop();
      });
      document.addEventListener("keyup", (e) => (keys[e.key] = false));

      canvas.addEventListener("mousedown", (e) => {
        if (!gameOver && shop.style.display === "none") {
          const rect = canvas.getBoundingClientRect();
          const mx = e.clientX - rect.left;
          const my = e.clientY - rect.top;
          const angle = Math.atan2(my - player.y, mx - player.x);
          const speed = weaponStats[selectedWeapon].speed;
          if (player.fireCooldown <= 0) {
            bullets.push({
              x: player.x,
              y: player.y,
              dx: Math.cos(angle) * speed,
              dy: Math.sin(angle) * speed,
              from: "player",
            });
            player.fireCooldown = player.fireRate;
          }
        }
      });

      canvas.addEventListener("click", (e) => {
        if (!gameOver && shop.style.display === "none") {
          const rect = canvas.getBoundingClientRect();
          player.targetX = e.clientX - rect.left;
          player.targetY = e.clientY - rect.top;
        }
      });

      function update() {
        if (shop.style.display === "block") return;

        if (gameOver) {
          gameOverTimer++;
          if (gameOverTimer >= 5 * 60) {
            resetGame();
          }
          return;
        }

        if (player.health <= 0) {
          gameOver = true;
          gameOverTimer = 0;
          return;
        }

        if (waveTimer > 0) {
          waveTimer--;
          return;
        }

        // حرکت با کیبورد
        if (keys["w"] && player.y - 15 > 0) player.y -= player.speed;
        if (keys["s"] && player.y + 15 < 600) player.y += player.speed;
        if (keys["a"] && player.x - 15 > 0) player.x -= player.speed;
        if (keys["d"] && player.x + 15 < 800) player.x += player.speed;

        // حرکت با ماوس
        if (player.targetX !== null && player.targetY !== null) {
          const dx = player.targetX - player.x;
          const dy = player.targetY - player.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 5) {
            player.x += (dx / dist) * player.speed;
            player.y += (dy / dist) * player.speed;
          } else {
            player.targetX = null;
            player.targetY = null;
          }
        }

        if (player.fireCooldown > 0) player.fireCooldown--;

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.x += b.dx;
          b.y += b.dy;
          if (b.x < 0 || b.x > 800 || b.y < 0 || b.y > 600)
            bullets.splice(i, 1);
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const dx = player.x - e.x;
          const dy = player.y - e.y;
          const dist = Math.hypot(dx, dy);
          e.x += (dx / dist) * e.speed;
          e.y += (dy / dist) * e.speed;

          if (dist < 20) player.health -= 1;

          if (e.shootCooldown <= 0) {
            const angle = Math.atan2(player.y - e.y, player.x - e.x);
            bullets.push({
              x: e.x,
              y: e.y,
              dx: Math.cos(angle) * 6,
              dy: Math.sin(angle) * 6,
              from: "enemy",
            });
            e.shootCooldown = 100 + Math.random() * 50;
          } else {
            e.shootCooldown--;
          }

          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (
              b.from === "player" &&
              Math.abs(b.x - e.x) < e.size &&
              Math.abs(b.y - e.y) < e.size
            ) {
              bullets.splice(j, 1);
              e.health -= weaponStats[selectedWeapon].damage;
              spawnParticles(e.x, e.y, e.color);
              if (e.health <= 0) {
                enemies.splice(i, 1);
                score += e.type === "boss" ? 50 : 10;
                break;
              }
            }
          }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          if (b.from === "enemy") {
            const dist = Math.hypot(b.x - player.x, b.y - player.y);
            if (dist < 15) {
              player.health -= 10;
              spawnParticles(player.x, player.y, "yellow");
              bullets.splice(i, 1);
            }
          }
        }

        spawnPowerUp();
        for (let i = powerUps.length - 1; i >= 0; i--) {
          const p = powerUps[i];
          p.life--;
          if (p.life <= 0) {
            powerUps.splice(i, 1);
            continue;
          }
          const dist = Math.hypot(p.x - player.x, p.y - player.y);
          if (dist < 20) {
            if (p.type === "health")
              player.health = Math.min(player.maxHealth, player.health + 50);
            if (p.type === "fireRate")
              player.fireRate = Math.max(5, player.fireRate - 5); // 5 ثانیه سریع‌تر
            powerUps.splice(i, 1);
          }
        }

        if (enemies.length === 0) {
          wave++;
          player.health = player.maxHealth;
          waveTimer = 3 * 60; // 3 ثانیه تاخیر
          spawnEnemy();
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.dx;
          p.y += p.dy;
          p.life--;
          p.radius -= 0.1;
          if (p.life <= 0 || p.radius <= 0) particles.splice(i, 1);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameOver) {
          drawGameOver();
          return;
        }

        drawPlayer();

        for (const b of bullets) {
          ctx.fillStyle = b.from === "enemy" ? "orange" : "yellow";
          ctx.beginPath();
          ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const e of enemies) drawEnemy(e);
        for (const p of powerUps) drawPowerUp(p);

        for (const p of particles) {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        drawHUD();
        drawMinimap();
      }

      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      spawnEnemy();
      gameLoop();
    </script>
  </body>
</html>
